[project]
name = "skif-bot"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "discord.py==2.6.3",
    "aiosqlite==0.21.0",
    "python-dotenv==1.1.1",
    "aiohttp==3.12.15",
]

[project.optional-dependencies]
dev = [
    "ruff==0.16.8",
]

[tool.ruff]
line-length = 150
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "C4", "DTZ", "RUF", "TRY", "BLE"]
ignore = [
    "E501",
    "TRY003",
    "RUF001",
    "RUF002",
    "RUF003",
    "E701",
    "E702",
]

[tool.ruff.format]
quote-style = "single"
