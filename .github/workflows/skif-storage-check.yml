name: Skif storage checks
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: '3.12'
            experimental: false
          - python-version: '3.13'
            experimental: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt ruff==0.16.8
      - run: python -m ruff check bot tests main.py
      - run: python -m ruff format --check bot tests main.py
      - run: python -m unittest discover -s tests
